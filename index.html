<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Halloween Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎃 Python Spooky Memory 🐍</h1>
        <div class="stats">
            <p>Movimientos: <span id="moves">0</span></p>
            <p>Aciertos: <span id="matches">0</span>/8</p>
        </div>
        <div class="grid" id="grid"></div>
        <button id="restart-btn">Reiniciar Hechizo 🔄</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
